<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ruido visual + auditivo</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #controls {
      padding: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    canvas {
      image-rendering: pixelated;
      width: 90vw;
      max-width: 800px;
      aspect-ratio: 1 / 1;
      border: 1px solid #444;
      background: #000;
    }

    button,
    select,
    input {
      background: #222;
      color: #eee;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    label {
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="toggleBtn">▶ Play</button>
    <label>Resolución:
      <select id="resSelect">
        <option value="16">16 x 16</option>
        <option value="32">32 x 32</option>
        <option value="64" selected>64 x 64</option>
        <option value="128">128 x 128</option>
        <option value="256">256 x 256</option>
        <option value="512">512 x 512</option>
      </select>
    </label>
    <label>Volumen:
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.2">
    </label>
  </div>

  <canvas id="canvas" width="64" height="64"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toggleBtn = document.getElementById('toggleBtn');
    const resSelect = document.getElementById('resSelect');
    const volSlider = document.getElementById('volSlider');

    let running = false;
    let rafId = null;
    let audioCtx = null;
    let noiseNode = null;
    let gainNode = null;

    // ---------- Canvas: pixels random frame a frame ----------
    function setResolution(size) {
      canvas.width = size;
      canvas.height = size;
    }

    function drawRandomFrame() {
      const w = canvas.width;
      const h = canvas.height;
      const imageData = ctx.createImageData(w, h);
      const data = imageData.data; // Uint8ClampedArray RGBA
      const n = data.length;
      for (let i = 0; i < n; i += 4) {
        //multicolor
        // data[i] = Math.random() * 256; // R
        // data[i + 1] = Math.random() * 256; // G
        // data[i + 2] = Math.random() * 256; // B
        // data[i + 3] = 255;                 // A

        //blanco y negro
        data[i] = Math.random() * 256; // R
        data[i + 1] = data[i]; // G
        data[i + 2] = data[i]; // B
        data[i + 3] = 255;                 // A
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function loop() {
      drawRandomFrame();
      rafId = requestAnimationFrame(loop);
    }

    // ---------- Audio: AudioWorklet con samples random ----------
    const workletCode = `
class NoiseProcessor extends AudioWorkletProcessor {
  process(inputs, outputs) {
    const output = outputs[0];
    for (let channel = 0; channel < output.length; channel++) {
      const channelData = output[channel];
      for (let i = 0; i < channelData.length; i++) {
        channelData[i] = Math.random() * 2 - 1; // valor random entre -1 y 1
      }
    }
    return true;
  }
}
registerProcessor('noise-processor', NoiseProcessor);
`;

    async function setupAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      const blob = new Blob([workletCode], { type: 'application/javascript' });
      const workletUrl = URL.createObjectURL(blob);
      await audioCtx.audioWorklet.addModule(workletUrl);

      noiseNode = new AudioWorkletNode(audioCtx, 'noise-processor');
      gainNode = audioCtx.createGain();
      gainNode.gain.value = parseFloat(volSlider.value);

      noiseNode.connect(gainNode).connect(audioCtx.destination);
    }

    // ---------- Controles ----------
    async function start() {
      if (running) return;
      running = true;
      toggleBtn.textContent = '⏸ Pause';

      await setupAudio();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      loop();
    }

    async function stop() {
      if (!running) return;
      running = false;
      toggleBtn.textContent = '▶ Play';

      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      if (audioCtx && audioCtx.state === 'running') {
        await audioCtx.suspend();
      }
    }

    toggleBtn.addEventListener('click', () => {
      if (running) stop(); else start();
    });

    resSelect.addEventListener('change', () => {
      setResolution(parseInt(resSelect.value, 10));
    });

    volSlider.addEventListener('input', () => {
      if (gainNode) {
        gainNode.gain.value = parseFloat(volSlider.value);
      }
    });

    // Estado inicial (pausado, sin dibujar hasta darle play)
    setResolution(parseInt(resSelect.value, 10));
  </script>

</body>
</html>
