    <script>

        class SeededRandomConSeno {
            constructor(seed) {
                this.seed = seed;
                this.current = seed
            }
            next() {
                this.current = Math.sin(this.current * 1664525 + 3485748) * 0.5 + 0.5
                return this.current
            }


        }



        class SeededRandomConUint32 {
            static maxUint32 = 4294967296 //valor maximo que puede ser representado/guardado en un unsigned integer de 32 bits,
            //si le hacemos +1 pega la vuelta y vuelve a 0.
            constructor(seed) {
                this.arr = new Uint32Array(1) //array de unsigned integer de 32 bits, de una sola posicion
                this.seed = seed; //guardamos el seed, solo para tenerlo, no hace falta.
                this.arr[0] = seed; //asignamos el seed al primer y unico elemento del array.
                //como es un Uint32Array, aunque el seed tenga coma, se guarda como un entero
                // this.arr[0] es nuestro "current"
            }
            next() {
                this.arr[0] = (this.arr[0] * 485749 + 5343543) //multiplicamos y sumamos para q aproposito de la vuelta al uint32
                return this.arr[0] / SeededRandomConUint32.maxUint32 //dividimos por el maximo para q nos de un numero entre 0 y 1
            }

            //mismas cuentas, pero usado como Hash Function
            hash(seed) {
                const value = (seed * 485749 + 5343543) % SeededRandomConUint32.maxUint32
                return value / SeededRandomConUint32.maxUint32
            }
        }


        class SeededRandomXor {
            constructor(seed) {
                this.state = seed >>> 0;
            }

            next() {
                let x = this.state;

                x ^= x << 13;
                x ^= x >>> 17;
                x ^= x << 5;

                this.state = x >>> 0;

                return this.state / 4294967296;
            }
        }


        class Mulberry32 {
            constructor(seed) {
                this.state = seed >>> 0;
            }

            next() {
                let t = this.state += 0x6D2B79F5;

                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            }
        }


        class PCG32 {
            constructor(seed = 0) {
                this.state = 0n;
                this.inc = 1442695040888963407n;

                this.next();
                this.state += BigInt(seed);
                this.next();
            }

            nextUint32() {
                const oldState = this.state;

                this.state =
                    oldState * 6364136223846793005n +
                    this.inc;

                const xorshifted =
                    Number(((oldState >> 18n) ^ oldState) >> 27n) >>> 0;

                const rot =
                    Number(oldState >> 59n) & 31;

                return (
                    (xorshifted >>> rot) |
                    (xorshifted << ((-rot) & 31))
                ) >>> 0;
            }

            next() {
                return this.nextUint32() / 4294967296;
            }
        }
    </script>
