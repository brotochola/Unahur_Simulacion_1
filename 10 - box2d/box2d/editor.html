<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor de escenas · Box2D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#26303a;
  --bg-2:#2f3b46;
  --bg-3:#384653;
  --screen:#0f171b;
  --grid:#1b282d;
  --grid-2:#243840;
  --ink:#e9eef1;
  --muted:#9eadb8;
  --line:#465663;
  --amber:#ffb23f;
  --cyan:#5ed0e6;
  --red:#ff6b5a;
  --violet:#b99cff;
  --green:#8fd694;
  --radius:10px;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55;font-variation-settings:"wdth" 100}
a{color:var(--cyan);text-underline-offset:3px}
a:hover{color:#9fe6f3}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
::selection{background:var(--amber);color:#1a1a1a}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:#1f2830;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
.topbar .home{color:var(--ink);text-decoration:none;font-weight:700;font-variation-settings:"wdth" 118;white-space:nowrap;font-size:15px}
.topbar nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.topbar nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:5px 9px;border-radius:6px;white-space:nowrap}
.topbar nav a b{color:var(--ink);font-weight:600;margin-right:5px;font-variant-numeric:tabular-nums}
.topbar nav a:hover{background:var(--bg-2);color:var(--ink)}
.topbar nav a[aria-current]{background:var(--bg-3);color:var(--ink)}
.topbar nav a[aria-current] b{color:var(--amber)}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:36px 22px 80px}
.prose{max-width:72ch}
h1{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:10px 0 18px;font-weight:800;font-variation-settings:"wdth" 122;letter-spacing:-.01em}
h2{font-size:clamp(25px,3vw,34px);line-height:1.1;margin:64px 0 14px;font-weight:750;font-variation-settings:"wdth" 116}
h3{font-size:21px;line-height:1.2;margin:34px 0 8px;font-weight:700;font-variation-settings:"wdth" 110}
h4{font-size:17px;margin:20px 0 6px;font-weight:700}
p{margin:0 0 14px}
.lead{font-size:21px;color:#d5dde3;max-width:64ch}
.muted{color:var(--muted)}
small,.small{font-size:14px}
ul,ol{padding-left:22px;margin:0 0 14px}
li{margin:4px 0}
hr{border:0;border-top:1px solid var(--line);margin:48px 0}
.kbd,kbd{font:600 13px var(--mono);background:var(--bg-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
code{font-family:var(--mono);font-size:.86em;background:#1c252c;padding:1px 5px;border-radius:4px;color:#f2d7a6}
.amber{color:var(--amber)}.cyan{color:var(--cyan)}.red{color:var(--red)}.violet{color:var(--violet)}.green{color:var(--green)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:22px;align-items:start}
.cols-2{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
@media (max-width:860px){.cols-2{grid-template-columns:1fr}}

/* ---------- instruments ---------- */
.rig{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:18px 0 22px;box-shadow:inset 0 1px 0 #ffffff0d}
.rig > .rig-title{font-weight:700;font-size:15px;margin:0 0 10px;color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rig > .rig-title .muted{font-weight:400}
.screen{position:relative;background:var(--screen);border-radius:7px;border:1px solid #0a1013;box-shadow:inset 0 0 0 1px #ffffff08, inset 0 6px 24px #0008;overflow:hidden}
.screen canvas{display:block;width:100%;touch-action:none}
.screen .tag{position:absolute;left:10px;top:7px;font:12px var(--mono);color:var(--muted);pointer-events:none}
.screen .tag-r{left:auto;right:10px}
.screens{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:760px){.screens{grid-template-columns:1fr}}
.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:end;margin-top:12px}
.ctl{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1 1 170px;max-width:300px}
.ctl label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.ctl label output{color:var(--ink);font:600 13px var(--mono);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.readout{font:13px var(--mono);color:var(--muted);background:var(--screen);border:1px solid #0a1013;border-radius:6px;padding:8px 10px;line-height:1.6}
.readout b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--amber) var(--p,50%),#1a2329 var(--p,50%));border-radius:2px}
input[type=range]::-moz-range-track{height:4px;background:#1a2329;border-radius:2px}
input[type=range]::-moz-range-progress{height:4px;background:var(--amber);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c9d2d8 60%,#8d999f);border:0;margin-top:-7px;box-shadow:0 1px 3px #0009}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c9d2d8 60%,#8d999f);border:0;box-shadow:0 1px 3px #0009}

button,.btn{font:600 15px var(--font);color:var(--ink);background:var(--bg-3);border:1px solid #556676;border-radius:8px;padding:8px 14px;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
button:hover,.btn:hover{background:#43535f}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--amber);border-color:var(--amber);color:#21180a}
button.primary:hover{background:#ffc66d}
button.playing{background:var(--cyan);border-color:var(--cyan);color:#06232a}
button.small{font-size:13px;padding:5px 10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #556676;border-radius:8px;overflow:hidden;background:#222c34}
.seg button{border:0;border-radius:0;background:transparent;border-right:1px solid #44535f;font-size:14px;padding:7px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#18212a}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;user-select:none}
.toggle input{appearance:none;width:38px;height:22px;border-radius:11px;background:#1a2329;border:1px solid #556676;position:relative;cursor:pointer;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#aab6be;top:2px;left:2px;transition:left .15s}
.toggle input:checked{background:var(--cyan);border-color:var(--cyan)}
.toggle input:checked::after{left:18px;background:#fff}
select{font:15px var(--font);background:var(--bg-3);color:var(--ink);border:1px solid #556676;border-radius:8px;padding:7px 10px}


/* ---------- code ---------- */
pre{background:#161e23;border:1px solid #0d1417;border-radius:8px;padding:14px 16px;overflow:auto;font:14px/1.6 var(--mono);color:#d6e1e8;margin:12px 0 18px;tab-size:2}
pre code{background:none;padding:0;color:inherit;font-size:inherit}
.tk-c{color:#71828e;font-style:italic}.tk-s{color:#a8e0a0}.tk-k{color:#ff9e7a}.tk-n{color:#ffcf73}.tk-t{color:#7fd8ec}.tk-f{color:#e0c2ff}

/* ---------- callouts ---------- */
.game{border:1px solid #3e5a49;background:#26372f;border-radius:var(--radius);padding:14px 18px;margin:18px 0}
.game > strong:first-child{color:var(--green);display:block;margin-bottom:4px}
.warn{border:1px solid #6a4a2c;background:#3a2f25;border-radius:var(--radius);padding:12px 16px;margin:16px 0;font-size:16px}
.figure{margin:18px 0}
.figure figcaption{font-size:14px;color:var(--muted);margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:15px;margin:12px 0 20px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num{font-family:var(--mono);font-size:14px;white-space:nowrap}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:70px;border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap}
.pager a{text-decoration:none;color:var(--ink);font-weight:600}
.pager a span{display:block;font-size:13px;color:var(--muted);font-weight:400}
.credits{font-size:13px;color:var(--muted);margin-top:30px;max-width:90ch}

@media (max-width:700px){
  .topbar{position:static;gap:8px}
  .topbar nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
}
@media (max-width:600px){
  body{font-size:17px}
  main{padding:24px 16px 60px}
  .topbar{padding:8px 12px}
  .rig{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ---------- unidad 9: extras ---------- */
.topbar .tag9{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stat{background:var(--screen);border:1px solid #0a1013;border-radius:7px;padding:6px 11px;min-width:110px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{font:600 17px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.stat.amber b{color:var(--amber)}.stat.cyan b{color:var(--cyan)}.stat.red b{color:var(--red)}.stat.green b{color:var(--green)}.stat.violet b{color:var(--violet)}
.demo{display:flex;gap:14px;align-items:center;border:1px solid #3f5466;background:#263644;border-radius:var(--radius);padding:12px 16px;margin:18px 0;text-decoration:none;color:var(--ink)}
.demo:hover{background:#2d4152;color:var(--ink)}
.demo .ico{font:700 22px var(--mono);color:var(--cyan);flex:none}
.demo b{display:block}
.demo span{color:var(--muted);font-size:15px}
.formula{font:600 17px var(--mono);background:#1c252c;border:1px solid #0d1417;border-radius:8px;padding:10px 14px;margin:12px 0 16px;color:#f2d7a6;overflow:auto;white-space:nowrap}
.formula small{color:var(--muted);font-weight:400}
.screen .tag-b{top:auto;bottom:7px}
.panel{background:var(--screen);border:1px solid #0a1013;border-radius:7px;padding:8px 10px;font:13px/1.55 var(--mono);color:var(--muted);overflow:auto}
.panel .hi{color:var(--ink);background:#2b3a1f;border-radius:3px}
.panel .ev{display:flex;gap:10px;white-space:nowrap;padding:1px 4px}
.panel .ev .t{color:var(--amber);min-width:62px;text-align:right}
.panel .ev .k-arr{color:var(--cyan)}.panel .ev .k-end{color:var(--green)}.panel .ev .k-x{color:var(--violet)}
.side{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}
@media (max-width:860px){.side{grid-template-columns:1fr}}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding-left:40px;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--bg-3);border:1px solid #556676;font:700 14px/28px var(--font);text-align:center;color:var(--amber)}
.timebox{display:inline-block;font:12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}

p code,li code,td code{white-space:nowrap}
.screen .tag{background:#0f171bb3;padding:1px 6px;border-radius:4px}
/* ---------- tooltips y explicaciones ---------- */
.term{border-bottom:1.5px dotted #9eadb8;cursor:help;outline:none}
.term:hover,.term:focus{border-bottom-color:var(--amber);color:#fff}
.ctl label > span:first-child,.stat > span{cursor:help;text-decoration:underline dotted #556676;text-underline-offset:3px}
.tipbox{position:fixed;z-index:100;display:none;max-width:min(340px,90vw);background:#0b1215;color:var(--ink);border:1px solid #556676;border-radius:8px;padding:8px 11px;font:14px/1.45 var(--font);box-shadow:0 8px 24px #0009;pointer-events:none}
details.how{margin:-4px 0 10px;font-size:15px;color:#cbd5dc}
details.how summary{cursor:pointer;color:var(--cyan);font-weight:600;font-size:14px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--cyan);color:#06232a;font:700 12px var(--font)}
details.how[open] summary{margin-bottom:6px}
details.how ul{margin:0 0 6px;padding-left:20px}
details.how li{margin:3px 0}
details.how p{margin:0 0 6px}

/* ---------- unidad 10: extras ---------- */
.topbar nav a.ed{color:var(--ink);background:#2f3f2b;border:1px solid #3e5a49}
.topbar nav a.ed b{color:var(--green)}
.topbar nav a.ed[aria-current]{background:#3e5a49}
.ptitle{font:600 12px var(--font);color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}
.screen canvas{cursor:grab}
.keys{font:13px var(--mono);color:var(--muted)}
.chip{display:inline-block;font:600 12px var(--mono);border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);vertical-align:2px}
.chip.on{color:#06232a;background:var(--cyan);border-color:var(--cyan)}
.matrix{border-collapse:collapse;width:auto;margin:6px 0}
.matrix td,.matrix th{padding:4px 8px;border:1px solid var(--line);text-align:center}
.matrix input{width:18px;height:18px;accent-color:var(--amber)}
.jt td:first-child{white-space:nowrap;font-weight:700}
.api{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 18px;margin:12px 0 18px}
.api div{background:#1c252c;border:1px solid #0d1417;border-radius:8px;padding:10px 12px;font-size:15px}
.api div b{display:block;font:600 13px var(--mono);color:#f2d7a6;margin-bottom:3px}
.pad{display:flex;gap:6px;flex-wrap:wrap}
.pad button{min-width:46px;justify-content:center}
.bug{border:1px solid #6a2c2c;background:#3a2525;border-radius:var(--radius);padding:12px 16px;margin:16px 0;font-size:16px}
.bug > strong:first-child{color:var(--red)}
@media (max-width:700px){body{overflow-x:hidden}main table{display:block;overflow-x:auto}.matrix{display:table}.side{grid-template-columns:1fr}.cols-2{grid-template-columns:1fr!important}}
@media (max-width:700px){p code,li code,td code{white-space:normal;overflow-wrap:anywhere}}

body.editor main{max-width:none;padding:0;margin:0}
body.editor .topbar{position:static}
.ed-app{display:grid;grid-template-columns:70px minmax(0,1fr) 310px;height:calc(100vh - 49px);min-height:520px}
.ed-tools{background:#1f2830;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:8px 6px;overflow-y:auto}
.ed-tools .sep{height:1px;background:var(--line);margin:6px 2px}
.ed-tools .lbl{font:600 10px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin:4px 0 0}
.ed-tools button{width:56px;min-height:46px;justify-content:center;padding:4px 0;flex-direction:column;font-size:10.5px;gap:1px;line-height:1.1;border-radius:8px;background:transparent;border-color:transparent}
.ed-tools button .ic{font:20px/1 var(--font)}
.ed-tools button:hover{background:var(--bg-2)}
.ed-tools button[aria-pressed=true]{background:var(--amber);color:#21180a;border-color:var(--amber)}
.ed-center{display:flex;flex-direction:column;min-width:0;min-height:0}
.ed-top{display:flex;gap:8px;align-items:center;padding:7px 10px;background:var(--bg-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-top .grow{flex:1}
.ed-top button{font-size:14px;padding:6px 11px}
.ed-play{min-width:110px;justify-content:center}
.ed-play.on{background:var(--red);border-color:var(--red);color:#2a0d09}
.ed-canvas{flex:1;position:relative;min-height:0;background:var(--screen)}
.ed-canvas canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ed-hint{position:absolute;left:12px;top:10px;font:12.5px var(--mono);color:#cfd8de;background:#0f171bcc;border:1px solid #26343b;border-radius:6px;padding:5px 9px;pointer-events:none;max-width:70%}
.ed-mode{position:absolute;right:12px;top:10px;font:600 12px var(--mono);padding:4px 9px;border-radius:6px;pointer-events:none;background:#0f171bcc;border:1px solid #26343b;color:var(--muted)}
.ed-mode.play{color:var(--green);border-color:#3e5a49}
.ed-status{font:12px var(--mono);color:var(--muted);padding:5px 10px;border-top:1px solid var(--line);background:#1f2830;display:flex;gap:18px;flex-wrap:wrap}
.ed-status b{color:var(--ink);font-weight:600}
.ed-panel{background:var(--bg-2);border-left:1px solid var(--line);overflow-y:auto;padding:12px 14px 30px}
.ed-panel h3{margin:4px 0 10px;font-size:17px}
.ed-panel h4{margin:16px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ed-panel .ctl{max-width:none;min-width:0;margin:6px 0}
.ed-panel .row{margin:6px 0}
.ed-panel .seg{width:100%}
.ed-panel .seg button{flex:1;justify-content:center;padding:6px 6px;font-size:13px}
.num2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.numf{display:flex;flex-direction:column;gap:2px}
.numf span{font-size:12px;color:var(--muted)}
.numf input{font:13px var(--mono);background:var(--screen);color:var(--ink);border:1px solid #3a4a56;border-radius:6px;padding:5px 7px;width:100%}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid transparent}
.swatches button[aria-pressed=true]{border-color:#fff}
.ed-panel .help{font-size:13.5px;color:#cbd5dc;line-height:1.5}
.ed-panel .help kbd{font-size:11px}
.ed-panel .tips li{margin:3px 0}
dialog.code{width:min(900px,94vw);max-height:86vh;background:var(--bg-2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px}
dialog.code::backdrop{background:#0009}
dialog.code pre{max-height:62vh}
@media (max-width:900px){.ed-app{grid-template-columns:1fr;height:auto}.ed-tools{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.ed-tools .sep,.ed-tools .lbl{display:none}.ed-canvas{height:62vh;flex:none}.ed-panel{border-left:0;border-top:1px solid var(--line)}}

</style>
</head>
<body class="editor">
<main>
  <div class="ed-app">
    <div class="ed-tools" id="tools"></div>
    <div class="ed-center">
      <div class="ed-top" id="top"></div>
      <div class="ed-canvas"><canvas id="cved" tabindex="0"></canvas><div class="ed-hint" id="hint"></div><div class="ed-mode" id="mode">EDICIÓN</div></div>
      <div class="ed-status" id="status"></div>
    </div>
    <div class="ed-panel" id="panel"></div>
  </div>
  <dialog class="code" id="codedlg"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Código para tu juego</h3><div class="row"><button id="copycode" class="primary">Copiar</button><button id="closecode">Cerrar</button></div></div>
    <p class="small muted">Arma esta misma escena con la API de Phaser Box2D. Pegalo en tu proyecto (con <code>PhaserBox2D.js</code> al lado) y llamá a <code>crearEscena()</code>.</p><pre><code id="codeout"></code></pre></dialog>
  <input type="file" id="fileinp" accept=".json,application/json" hidden>
</main>
<script src="phaser-box2d.js"></script>
<script>
/* ---------------- glosario: patrón (regex sin bordes) y explicación ----------------

    const L = Math.hypot(X2 - X1, Y2 - Y1); if (L < 1) return; const ux = (X2 - X1) / L, uy = (Y2 - Y1) / L, hl = Math.min(10, L * 0.4);

      const g = lab.g, L = look(color), X = lab.sx(xf.p.x), Y = lab.sy(xf.p.y), R = r * lab.scale;
      g.beginPath(); g.arc(X, Y, R, 0, Math.PI * 2); finish(g, L);
      g.strokeStyle = L[1]; g.beginPath(); g.moveTo(X, Y); g.lineTo(X + xf.q.c * R, Y - xf.q.s * R); g.stroke();
    };
    d.DrawSolidCapsule = (p1, p2, r, color) => {
      const g = lab.g, L = look(color), X1 = lab.sx(p1.x), Y1 = lab.sy(p1.y), X2 = lab.sx(p2.x), Y2 = lab.sy(p2.y), R = r * lab.scale;
      const a = Math.atan2(Y2 - Y1, X2 - X1);

      const g = lab.g, st = STATE.get(color), col = st ? LOOK[st][1] : hexCss(color);
      g.strokeStyle = st === 'static' ? '#9fb0ba' : col; g.lineWidth = st ? 2.5 : 1.5; g.beginPath(); g.moveTo(lab.sx(p1.x), lab.sy(p1.y)); g.lineTo(lab.sx(p2.x), lab.sy(p2.y)); g.stroke();
    };
    d.DrawPolygon = (xf, vs, n, color) => {
      const g = lab.g; g.strokeStyle = hexCss(color, 0.55); g.lineWidth = 1; g.beginPath();
      for (let i = 0; i < n; i++) { const v = xf ? B.b2TransformPoint(xf, vs[i]) : vs[i]; i ? g.lineTo(lab.sx(v.x), lab.sy(v.y)) : g.moveTo(lab.sx(v.x), lab.sy(v.y)); }
      g.closePath(); g.stroke();
    };
    d.DrawCircle = (p, r, color) => { const g = lab.g; g.strokeStyle = hexCss(color, 0.8); g.lineWidth = 1; g.beginPath(); g.arc(lab.sx(p.x), lab.sy(p.y), Math.max(2, r * lab.scale), 0, 7); g.stroke(); };

    d.DrawTransform = (xf) => {
      const g = lab.g, X = lab.sx(xf.p.x), Y = lab.sy(xf.p.y), L = 14;
      g.lineWidth = 1.5; g.strokeStyle = COL.red; g.beginPath(); g.moveTo(X, Y); g.lineTo(X + xf.q.c * L, Y - xf.q.s * L); g.stroke();
      g.strokeStyle = COL.green; g.beginPath(); g.moveTo(X, Y); g.lineTo(X - xf.q.s * L, Y - xf.q.c * L); g.stroke();
      g.fillStyle = COL.ink; g.beginPath(); g.arc(X, Y, 2.5, 0, 7); g.fill();

    d.DrawString = (p, s) => { text(lab.g, String(s).trim(), lab.sx(p.x) + 4, lab.sy(p.y) - 4, '#cfd8de', 'left', '11px JetBrains Mono, monospace'); };

  }
  /* ---------- mouse: arrastrar con un mouse joint ---------- */
  _bindPointer() {
    const cv = this.cv;
    const P = e => { const r = cv.getBoundingClientRect(); return { x: this.wx(e.clientX - r.left), y: this.wy(e.clientY - r.top) }; };
    cv.addEventListener('pointerdown', e => {
      if (!this.world) return; const p = P(e); this.pointer = p;
      if (this.o.pointer && this.o.pointer('down', p, e, this)) { cv.setPointerCapture(e.pointerId); return; }
      if (this.o.drag === false) return;
      const hit = this.pick(p); if (!hit) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId);

      md.maxForce = (this.o.dragForce || 1000) * Math.max(0.5, B.b2Body_GetMass(hit.body)) * 10;
      const joint = B.b2CreateMouseJoint(this.world, md);
      B.b2Body_SetAwake(hit.body, true);
      this.drag = { joint, body: hit.body, target: V2(p.x, p.y), local: B.b2Body_GetLocalPoint(hit.body, V2(p.x, p.y)) };
    });

      if (!this.world) return; const p = P(e); this.pointer = p; this.hover = true;
      if (this.o.pointer && this.o.pointer('move', p, e, this)) return;

    });

      if (!this.world) return; const p = P(e);
      if (this.o.pointer) this.o.pointer('up', p, e, this);

  /* ---------- controles estándar ---------- */
  controls(parent, opts = {}) {
    const row = h('div', { class: 'row' });
    const bp = button(row, this.paused ? 'Seguir' : 'Pausar', () => { this.paused = !this.paused; bp.textContent = this.paused ? 'Seguir' : 'Pausar'; });
    this._pauseBtn = bp;
    button(row, 'Un paso', () => { this.ensure(); if (!this.paused) { this.paused = true; bp.textContent = 'Seguir'; } this.stepOnce(); });
    button(row, 'Reiniciar', () => { this.reset(); if (opts.onReset) opts.onReset(); }, 'primary');
    if (opts.slow !== false) toggle(row, 'Cámara lenta', false, v => this.timeScale = v ? 0.2 : 1);
    (typeof parent === 'string' ? $(parent) : parent).append(row);
    return row;
  }
  setPaused(v) { this.paused = v; if (this._pauseBtn) this._pauseBtn.textContent = v ? 'Seguir' : 'Pausar'; }
}

/* toggles de "qué dibujar": flagToggles('#ctl', lab, ['aabbs','mass','contacts']) */
const FLAG_NAMES = { joints: 'Joints', aabbs: 'AABB', mass: 'Centro de masa', contacts: 'Puntos de contacto', normals: 'Normales', impulses: 'Impulsos', friction: 'Fricción', graph: 'Colores del grafo' };
function flagToggles(parent, lab, keys) {
  const row = h('div', { class: 'row' });
  for (const k of keys) toggle(row, FLAG_NAMES[k], lab.flags[k], v => lab.flags[k] = v);
  (typeof parent === 'string' ? $(parent) : parent).append(row); return row;
}
/* leer posición/ángulo cómodo */
const pos = b => B.b2Body_GetPosition(b);
const ang = b => B.b2Rot_GetAngle(B.b2Body_GetRotation(b));
const vel = b => B.b2Body_GetLinearVelocity(b);

const idKey = id => id ? id.index1 * 65536 + id.revision : -1;
const sameId = (a, b) => a && b && a.index1 === b.index1 && a.revision === b.revision && a.world0 === b.world0;
/* rayo al más cercano con b2World_CastRay y el callback clásico: devolver fraction recorta el rayo hasta ese impacto
   (es lo que hace b2World_CastRayClosest por dentro; ver los parches del capítulo 8) */
function rayClosest(world, o, t, filter = B.b2DefaultQueryFilter()) {
  let best = null;
  B.b2World_CastRay(world, V2(o.x, o.y), V2(t.x, t.y), filter, (shapeId, point, normal, fraction) => {
    best = { shapeId, point: V2(point.x, point.y), normal: V2(normal.x, normal.y), fraction }; return fraction;
  }, null);
  return best;
}
/* formas de un cuerpo (b2Body_GetShapes llena un array y devuelve la cantidad) */
function shapesOf(b) { const a = []; B.b2Body_GetShapes(b, a); return a; }

<script>
/* ======================================================================
   Editor de escenas de Box2D. La escena es un objeto JSON (el "modelo"):
   en modo edición se dibuja el modelo; al apretar Simular se construye un

   ====================================================================== */
const ED = { mode: 'edit', tool: 'select', sel: null, model: null, undo: [], redo: [], snap: true, drag: null, draft: null, keys: { l: 0, r: 0 }, nextId: 1, hover: null, dirtyPanel: true };
const SNAP = 0.25, COLORS = [0, PC.amber, PC.cyan, PC.green, PC.violet, PC.red, PC.pink, PC.sand, PC.blue];
const snapv = v => ED.snap ? Math.round(v / SNAP) * SNAP : v;
const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------------- modelo ---------------- */
function emptyModel() { return { v: 1, world: { gx: 0, gy: -10, sub: 4, rest: 1 }, bodies: [], joints: [] }; }

function addJoint(j) { j.id = newId(); ED.model.joints.push(Object.assign({ collide: false }, j)); return j; }
function bodyById(id) { return ED.model.bodies.find(b => b.id === id) || null; }
const SH = { box: (hw, hh, radius = 0) => ({ kind: 'box', hw, hh, radius }), circle: r => ({ kind: 'circle', r }), capsule: (hl, r) => ({ kind: 'capsule', hl, r }), poly: (pts, radius = 0) => ({ kind: 'poly', pts, radius }), chain: (pts, loop = false) => ({ kind: 'chain', pts, loop }) };

  revolute: { enableLimit: false, lower: -45, upper: 45, enableMotor: false, motorSpeed: 2, maxMotor: 300, enableSpring: false, hertz: 2, damping: 0.3, keys: false },
  weld: { linearHertz: 0, angularHertz: 0, damping: 0.5 },
  distance: { length: 0, enableSpring: false, hertz: 2, damping: 0.3, rope: false },
  prismatic: { axisDeg: 0, enableLimit: true, lower: -2, upper: 2, enableMotor: false, motorSpeed: 2, maxMotor: 500, enableSpring: false, hertz: 2, damping: 0.3, keys: false },
  wheel: { axisDeg: 90, enableSpring: true, hertz: 4, damping: 0.7, enableMotor: true, motorSpeed: 0, maxMotor: 60, keys: true },
};
const JNAME = { revolute: 'Bisagra (revolute)', weld: 'Soldadura (weld)', distance: 'Distancia / resorte', prismatic: 'Riel (prismatic)', wheel: 'Rueda (wheel)' };

/* ---------------- geometría del modelo ---------------- */
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

  if (s.kind === 'circle') return Math.hypot(lx, ly) <= s.r + tol;

/* ---------------- deshacer ---------------- */
function commit() { ED.undo.push(JSON.stringify(ED.model)); if (ED.undo.length > 200) ED.undo.shift(); ED.redo = []; }
function saveLocal() { try { localStorage.setItem('u10-editor-escena', JSON.stringify(ED.model)); } catch (e) { } }

function undo() { if (!ED.undo.length || ED.mode !== 'edit') return; ED.redo.push(JSON.stringify(ED.model)); ED.model = JSON.parse(ED.undo.pop()); fixSel(); changed(); }

function fixSel() { if (ED.sel && ED.sel.t === 'b' && !bodyById(ED.sel.id)) ED.sel = null; if (ED.sel && ED.sel.t === 'j' && !ED.model.joints.find(j => j.id === ED.sel.id)) ED.sel = null; }
function selected() { if (!ED.sel) return null; return ED.sel.t === 'b' ? bodyById(ED.sel.id) : ED.model.joints.find(j => j.id === ED.sel.id) || null; }

function dup() { const s = selected(); if (!s || ED.sel.t !== 'b' || ED.mode !== 'edit') return; commit(); const c = clone(s); c.x += 0.75; c.y += 0.75; addBody(c); ED.sel = { t: 'b', id: c.id }; changed(); }

/* ---------------- construir el mundo de Box2D ---------------- */
function buildWorld(L) {
  const M = ED.model, map = new Map();
  B.b2World_SetGravity(L.world, V2(M.world.gx, M.world.gy)); B.b2World_SetRestitutionThreshold(L.world, M.world.rest); L.sub = M.world.sub;

    else if (s.kind === 'capsule') L.capsule(0, 0, s.hl, s.r, o);

    if (j.kind === 'weld') Object.assign(o, { linearHertz: j.linearHertz, angularHertz: j.angularHertz, linearDampingRatio: j.damping, angularDampingRatio: j.damping });
    if (j.kind === 'prismatic') Object.assign(o, { axis: [Math.cos(rad(j.axisDeg)), Math.sin(rad(j.axisDeg))], enableLimit: j.enableLimit, lowerTranslation: j.lower, upperTranslation: j.upper, enableMotor: j.enableMotor || j.keys, motorSpeed: j.keys ? 0 : j.motorSpeed, maxMotorForce: j.maxMotor, enableSpring: j.enableSpring, hertz: j.hertz, dampingRatio: j.damping });
    if (j.kind === 'wheel') Object.assign(o, { axis: [Math.cos(rad(j.axisDeg)), Math.sin(rad(j.axisDeg))], enableSpring: j.enableSpring, hertz: j.hertz, dampingRatio: j.damping, enableMotor: j.enableMotor || j.keys, motorSpeed: j.keys ? 0 : j.motorSpeed, maxMotorTorque: j.maxMotor });
    if (j.kind === 'distance') { const len = j.length > 0 ? j.length : Math.hypot(j.anchorB[0] - P[0], j.anchorB[1] - P[1]); Object.assign(o, { anchorB: j.anchorB, length: len, enableSpring: j.enableSpring || j.rope, hertz: j.rope ? 0 : j.hertz, dampingRatio: j.damping, enableLimit: j.rope, minLength: 0, maxLength: len }); }

const f2 = v => +(+v).toFixed(3);

  const M = ED.model, L = [];
  L.push('// Escena hecha con el editor de la Unidad 10 (Phaser Box2D 1.1.0)');
  L.push("import * as P from './PhaserBox2D.js';");
  L.push('const { b2Vec2, b2MakeRot, b2BodyType } = P;', '');
  L.push('export function crearEscena() {');
  L.push('  P.b2CreateWorldArray();');
  L.push('  const worldDef = P.b2DefaultWorldDef();');
  L.push(`  worldDef.gravity = new b2Vec2(${f2(M.world.gx)}, ${f2(M.world.gy)});`);
  L.push(`  worldDef.restitutionThreshold = ${f2(M.world.rest)};`);
  L.push('  const worldId = P.b2CreateWorld(worldDef);');
  L.push('  const mundo = P.b2CreateBody(worldId, P.b2DefaultBodyDef());   // ancla para los joints "al mundo"');
  L.push('  const cuerpos = {};', '');
  for (const b of M.bodies) {
    const s = b.shape; L.push(`  { // ${s.kind} #${b.id}`);
    L.push('    const bd = P.b2DefaultBodyDef();');
    if (b.type !== 'static') L.push(`    bd.type = b2BodyType.b2_${b.type}Body;`);
    L.push(`    bd.position = new b2Vec2(${f2(b.x)}, ${f2(b.y)});`);
    if (b.a) L.push(`    bd.rotation = b2MakeRot(${f2(b.a)});`);
    if (b.vx || b.vy) L.push(`    bd.linearVelocity = new b2Vec2(${f2(b.vx)}, ${f2(b.vy)});`);
    if (b.w) L.push(`    bd.angularVelocity = ${f2(b.w)};`);
    for (const [k, f] of [['linDamp', 'linearDamping'], ['angDamp', 'angularDamping']]) if (b[k]) L.push(`    bd.${f} = ${f2(b[k])};`);
    if (b.gravityScale !== 1) L.push(`    bd.gravityScale = ${f2(b.gravityScale)};`);
    if (b.fixedRotation) L.push('    bd.fixedRotation = true;'); if (b.bullet) L.push('    bd.isBullet = true;');
    L.push('    const id = P.b2CreateBody(worldId, bd);');
    if (s.kind === 'chain') { const pts = chainPoints(s); L.push('    const cd = P.b2DefaultChainDef();', `    cd.points = [${pts.map(q => `new b2Vec2(${f2(q[0])}, ${f2(q[1])})`).join(', ')}];`, '    cd.count = cd.points.length;', `    cd.isLoop = ${!!s.loop};`, `    cd.friction = ${f2(b.friction)};`, '    P.b2CreateChain(id, cd);'); }
    else { L.push('    const sd = P.b2DefaultShapeDef();', `    sd.density = ${f2(b.density)}; sd.friction = ${f2(b.friction)}; sd.restitution = ${f2(b.restitution)};`);
      if (b.color) L.push(`    sd.customColor = 0x${b.color.toString(16)};`); if (b.sensor) L.push('    sd.isSensor = true;'); if (b.group) L.push(`    sd.filter.groupIndex = ${b.group};`);
      if (s.kind === 'box') L.push(s.radius ? `    P.b2CreatePolygonShape(id, sd, P.b2MakeRoundedBox(${f2(s.hw)}, ${f2(s.hh)}, ${f2(s.radius)}));` : `    P.b2CreatePolygonShape(id, sd, P.b2MakeBox(${f2(s.hw)}, ${f2(s.hh)}));`);
      if (s.kind === 'circle') L.push(`    P.b2CreateCircleShape(id, sd, new P.b2Circle(new b2Vec2(0, 0), ${f2(s.r)}));`);
      if (s.kind === 'capsule') L.push('    const c = new P.b2Capsule();', `    c.center1 = new b2Vec2(${f2(-s.hl)}, 0); c.center2 = new b2Vec2(${f2(s.hl)}, 0); c.radius = ${f2(s.r)};`, '    P.b2CreateCapsuleShape(id, sd, c);');
      if (s.kind === 'poly') L.push(`    const pts = [${s.pts.map(q => `new b2Vec2(${f2(q[0])}, ${f2(q[1])})`).join(', ')}];`, `    P.b2CreatePolygonShape(id, sd, P.b2MakePolygon(P.b2ComputeHull(pts, pts.length), ${f2(s.radius)}));`); }
    L.push(`    cuerpos[${b.id}] = id;`, '  }');
  }
  const FN = { revolute: 'Revolute', weld: 'Weld', distance: 'Distance', prismatic: 'Prismatic', wheel: 'Wheel' };
  if (M.joints.length) L.push('', '  // joints: las anclas se escriben en coordenadas de mundo y se pasan a locales');
  for (const j of M.joints) {
    L.push(`  { // ${JNAME[j.kind]} #${j.id}`, `    const jd = P.b2Default${FN[j.kind]}JointDef();`, `    jd.bodyIdA = ${j.a == null ? 'mundo' : `cuerpos[${j.a}]`}; jd.bodyIdB = cuerpos[${j.b}];`,
      `    const p = new b2Vec2(${f2(j.anchor[0])}, ${f2(j.anchor[1])});`, '    jd.localAnchorA = P.b2Body_GetLocalPoint(jd.bodyIdA, p);');
    if (j.kind === 'distance') { const len = j.length > 0 ? j.length : Math.hypot(j.anchorB[0] - j.anchor[0], j.anchorB[1] - j.anchor[1]); L.push(`    jd.localAnchorB = P.b2Body_GetLocalPoint(jd.bodyIdB, new b2Vec2(${f2(j.anchorB[0])}, ${f2(j.anchorB[1])}));`, `    jd.length = ${f2(len)};`);
      if (j.rope) L.push(`    jd.enableSpring = true; jd.hertz = 0; jd.enableLimit = true; jd.minLength = 0; jd.maxLength = ${f2(len)};`); else if (j.enableSpring) L.push(`    jd.enableSpring = true; jd.hertz = ${f2(j.hertz)}; jd.dampingRatio = ${f2(j.damping)};`); }
    else L.push('    jd.localAnchorB = P.b2Body_GetLocalPoint(jd.bodyIdB, p);');
    if (['revolute', 'weld', 'prismatic', 'wheel'].includes(j.kind) && j.kind !== 'wheel') L.push('    jd.referenceAngle = P.b2RelativeAngle(P.b2Body_GetRotation(jd.bodyIdB), P.b2Body_GetRotation(jd.bodyIdA));');
    if (j.kind === 'prismatic' || j.kind === 'wheel') L.push(`    jd.localAxisA = P.b2Body_GetLocalVector(jd.bodyIdA, new b2Vec2(${f2(Math.cos(rad(j.axisDeg)))}, ${f2(Math.sin(rad(j.axisDeg)))}));`);
    if (j.kind === 'revolute') { if (j.enableLimit) L.push(`    jd.enableLimit = true; jd.lowerAngle = ${f2(rad(j.lower))}; jd.upperAngle = ${f2(rad(j.upper))};`); if (j.enableMotor || j.keys) L.push(`    jd.enableMotor = true; jd.motorSpeed = ${f2(j.keys ? 0 : j.motorSpeed)}; jd.maxMotorTorque = ${f2(j.maxMotor)};`); if (j.enableSpring) L.push(`    jd.enableSpring = true; jd.hertz = ${f2(j.hertz)}; jd.dampingRatio = ${f2(j.damping)};`); }
    if (j.kind === 'weld') L.push(`    jd.linearHertz = ${f2(j.linearHertz)}; jd.angularHertz = ${f2(j.angularHertz)}; jd.linearDampingRatio = jd.angularDampingRatio = ${f2(j.damping)};`);
    if (j.kind === 'prismatic') { if (j.enableLimit) L.push(`    jd.enableLimit = true; jd.lowerTranslation = ${f2(j.lower)}; jd.upperTranslation = ${f2(j.upper)};`); if (j.enableMotor || j.keys) L.push(`    jd.enableMotor = true; jd.motorSpeed = ${f2(j.keys ? 0 : j.motorSpeed)}; jd.maxMotorForce = ${f2(j.maxMotor)};`); if (j.enableSpring) L.push(`    jd.enableSpring = true; jd.hertz = ${f2(j.hertz)}; jd.dampingRatio = ${f2(j.damping)};`); }
    if (j.kind === 'wheel') { L.push(`    jd.enableSpring = ${!!j.enableSpring}; jd.hertz = ${f2(j.hertz)}; jd.dampingRatio = ${f2(j.damping)};`); if (j.enableMotor || j.keys) L.push(`    jd.enableMotor = true; jd.motorSpeed = ${f2(j.keys ? 0 : j.motorSpeed)}; jd.maxMotorTorque = ${f2(j.maxMotor)};`); }
    if (j.collide) L.push('    jd.collideConnected = true;');
    L.push(`    P.b2Create${FN[j.kind]}Joint(worldId, jd);`, '  }');
  }
  L.push('', '  return { worldId, cuerpos };', '}', '', '// en el loop del juego (paso fijo, capítulo 2):', `// P.b2World_Step(worldId, 1 / 60, ${M.world.sub});`);
  return L.join('\n');
}
function showCode() { $('#codeout').innerHTML = highlight(genCode()); $('#codedlg').showModal(); }
$('#closecode').addEventListener('click', () => $('#codedlg').close());
$('#copycode').addEventListener('click', async () => { try { await navigator.clipboard.writeText(genCode()); $('#copycode').textContent = '¡Copiado!'; setTimeout(() => $('#copycode').textContent = 'Copiar', 1500); } catch (e) { const r = document.createRange(); r.selectNodeContents($('#codeout')); getSelection().removeAllRanges(); getSelection().addRange(r); } });

/* ---------------- escenas de ejemplo ---------------- */
function makeTemplate(k) {
  const prev = ED.model; ED.model = emptyModel(); const M = ED.model;
  const ground = (w = 30) => addBody(mkBody('static', 0, -0.5, SH.box(w, 0.5), { friction: 0.7 }));
  const box = (x, y, hw, hh, o = {}) => addBody(mkBody(o.type || 'dynamic', x, y, SH.box(hw, hh, o.radius || 0), o));
  const circ = (x, y, r, o = {}) => addBody(mkBody(o.type || 'dynamic', x, y, SH.circle(r), o));
  const caps = (x, y, hl, r, o = {}) => addBody(mkBody(o.type || 'dynamic', x, y, SH.capsule(hl, r), o));
  const J = (kind, a, b, anchor, o = {}) => addJoint(Object.assign({ kind, a: a ? a.id : null, b: b.id, anchor }, clone(JDEF[kind]), o));
  if (k === 'vacio') { ground(); }
  if (k === 'piramide') { ground(); const n = 12; for (let r = 0; r < n; r++) for (let i = 0; i < n - r; i++) box((i - (n - r - 1) / 2) * 1.02, 0.5 + r, 0.49, 0.49); circ(-12, 3, 0.6, { vx: 25, density: 8, color: PC.red }); }
  if (k === 'domino') { ground(); box(-11, 4, 3, 0.15, { type: 'static', a: -0.35 }); circ(-13, 5.3, 0.4, { color: PC.red, density: 3 });
    for (let i = 0; i < 16; i++) box(-6.5 + i * 0.9, 0.9, 0.09, 0.9, { color: i % 2 ? PC.amber : PC.sand });
    const pivot = box(9.5, 0.4, 0.2, 0.4, { type: 'static' }); const plank = box(9.5, 0.95, 2.6, 0.12, { color: PC.cyan }); J('revolute', pivot, plank, [9.5, 0.95]); box(11.5, 1.4, 0.35, 0.35, { color: PC.violet, density: 0.5 }); }
  if (k === 'auto') { const pts = []; for (let x = -30; x <= 60; x += 1.5) pts.push([x, x < -10 ? 0 : 0.6 * Math.sin(x * 0.4) + 0.4 * Math.sin(x * 1.1) + (x > 20 && x < 32 ? (x - 20) * 0.25 : x >= 32 && x < 44 ? 3 - (x - 32) * 0.25 : 0)]); addBody(mkBody('static', 0, 0, SH.chain(pts), { friction: 0.9 }));
    const ch = addBody(mkBody('dynamic', -14, 1.6, SH.poly([[-1.5, -0.3], [1.5, -0.3], [1.5, 0.05], [0.4, 0.55], [-1.1, 0.55], [-1.5, 0.15]]), { color: PC.amber, density: 1.5 }));
    for (const dx of [-1.05, 1.05]) { const wh = circ(-14 + dx, 1.0, 0.42, { color: PC.ink, friction: 1.2 }); J('wheel', ch, wh, [-14 + dx, 1.0], { keys: true, motorSpeed: 30, maxMotor: 60 }); }
    for (let i = 0; i < 5; i++) box(-4 + i * 0.6, 1.3, 0.25, 0.25, { density: 0.4, color: PC.sand }); }
  if (k === 'puente') { ground(); const n = 14, w = 0.5, x0 = -n * w, L1 = box(x0 - 0.5, 1.5, 0.5, 1.5, { type: 'static' }), R1 = box(-x0 + 0.5, 1.5, 0.5, 1.5, { type: 'static' });
    let prev = L1; for (let i = 0; i < n; i++) { const p = box(x0 + w + i * 2 * w, 2.9, w, 0.1, { color: PC.sand, density: 3 }); J('revolute', prev, p, [x0 + i * 2 * w, 2.9]); prev = p; } J('revolute', prev, R1, [-x0, 2.9]);
    box(-2, 6, 0.5, 0.5, { color: PC.red, density: 4 }); circ(2, 7, 0.5, { color: PC.cyan }); box(4, 8, 0.4, 0.4, { color: PC.violet }); }
  if (k === 'newton') { ground(); const beam = box(0, 6.2, 3.2, 0.12, { type: 'static' });
    for (let i = 0; i < 5; i++) { const x = -2 + i * 1.0; const ball = circ(i === 0 ? x - 3 : x, i === 0 ? 3.5 : 2.6, 0.5, { restitution: 1, friction: 0, color: i === 0 ? PC.red : PC.cyan, density: 2 });
      J('distance', beam, ball, [x, 6.1], { anchorB: [ball.x, ball.y], length: 3.5 }); }
    M.world.rest = 0.1; }
  if (k === 'molino') { ground(); const hub = box(0, 4, 0.3, 0.3, { type: 'static', sensor: true }); /* sensor: si no, las aspas chocan contra el eje */ const blade = box(0, 4, 3.2, 0.15, { color: PC.cyan, density: 2 }); const b2 = box(0, 4, 0.15, 3.2, { color: PC.cyan, density: 2 });
    J('weld', blade, b2, [0, 4]); J('revolute', hub, blade, [0, 4], { enableMotor: true, motorSpeed: -1.5, maxMotor: 3000 });
    addBody(mkBody('static', 0, 0, SH.chain([[-13, 10], [-8, 8.2], [-3.6, 7.3]]))); addBody(mkBody('static', 0, 0, SH.chain([[3.6, 7.3], [8, 8.2], [13, 10]])));
    for (let i = 0; i < 40; i++) circ(-12 + (i % 10) * 0.55, 10.5 + Math.floor(i / 10) * 0.6, 0.22, { color: [PC.amber, PC.green, PC.violet, PC.pink][i % 4], restitution: 0.3 }); }
  if (k === 'catapulta') { ground(); const tri = addBody(mkBody('static', -6, 0.5, SH.poly([[-0.6, -0.5], [0.6, -0.5], [0, 0.5]])));
    const arm = box(-6, 1.05, 3.2, 0.12, { color: PC.sand, density: 1, a: 0.27 }); J('revolute', tri, arm, [-6, 1.05]);   // arranca con la punta izquierda en el piso
    const cupP = toWorld(arm, -3.05, 0.35), cup = box(cupP.x, cupP.y, 0.06, 0.25, { color: PC.sand, density: 1, a: 0.27 }); J('weld', arm, cup, [cupP.x, cupP.y]);
    const ballP = toWorld(arm, -2.6, 0.48); circ(ballP.x, ballP.y, 0.35, { color: PC.red, density: 1 });
    box(-3.25, 7, 0.55, 0.55, { color: PC.violet, density: 14 });
    for (let r = 0; r < 4; r++) for (let i = 0; i < 4 - r; i++) box(9 + i * 0.82 + r * 0.41, 0.4 + r * 0.8, 0.4, 0.4, { color: PC.amber }); }
  if (k === 'ragdoll') { ground(); for (let s = 0; s < 7; s++) box(4 + s * 1.2, 0.3 + s * 0.3, 0.6, 0.3 + s * 0.3, { type: 'static' });
    const G = -1, x = -4, y = 2.2; const torso = caps(x, y + 1.0, 0.35, 0.28, { a: Math.PI / 2, group: G, color: PC.amber }); const head = circ(x, y + 2.0, 0.3, { group: G, color: PC.amber });
    J('revolute', torso, head, [x, y + 1.7], { enableLimit: true, lower: -40, upper: 40 });
    for (const sx of [-1, 1]) { const ua = caps(x + sx * 0.55, y + 1.2, 0.25, 0.12, { group: G, color: PC.cyan }), la = caps(x + sx * 1.15, y + 1.2, 0.25, 0.11, { group: G, color: PC.cyan });
      J('revolute', torso, ua, [x + sx * 0.25, y + 1.2]); J('revolute', ua, la, [x + sx * 0.85, y + 1.2], { enableLimit: true, lower: sx < 0 ? -150 : 0, upper: sx < 0 ? 0 : 150 });
      const ul = caps(x + sx * 0.18, y + 0.15, 0.3, 0.14, { a: Math.PI / 2, group: G, color: PC.green }), ll = caps(x + sx * 0.18, y - 0.8, 0.3, 0.13, { a: Math.PI / 2, group: G, color: PC.green });
      J('revolute', torso, ul, [x + sx * 0.18, y + 0.55], { enableLimit: true, lower: -60, upper: 60 }); J('revolute', ul, ll, [x + sx * 0.18, y - 0.35], { enableLimit: true, lower: -130, upper: 0 }); }
    box(-9, 1, 0.5, 1, { type: 'static' }); }
  ED.model = prev; return M;
}
