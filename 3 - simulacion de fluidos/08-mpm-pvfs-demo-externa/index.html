    <script>
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl', { powerPreference: 'high-performance', antialias: false, depth: false, stencil: false });
        let ctx2d;

        if (!gl) {
            console.error('WebGL not supported, falling back to Canvas');
            ctx2d = canvas.getContext('2d');
        }

        let orientationAngle = screen.orientation.angle;
        let isAndroid = false;
        let isiPad = false;
        let isWindows = false;

        if (navigator.userAgent.includes('Android')) {
            isAndroid = true;
        }

        if (navigator.userAgent.includes('Windows')) {
            isWindows = true;
        }

        if (navigator.userAgent.includes('iPad')) {
            isiPad = true;
        } else {
            if (!navigator.userAgent.includes('iPhone') && navigator.userAgent.includes('Mac')) {
                // check if iPad masquerading as Mac doesn't need to be super accurate cause I just care about orientation
                if (navigator.maxTouchPoints && navigator.maxTouchPoints > 1) {
                    isiPad = true;
                }
            }
        }


        if (isiPad) {
            orientationAngle -= 90;

            if (orientationAngle < 0) {
                orientationAngle += 360;
            }
        }

        screen.orientation.addEventListener('change', (event) => {
            orientationAngle = screen.orientation.angle;

            if (isiPad) {
                orientationAngle -= 90;

                if (orientationAngle < 0) {
                    orientationAngle += 360;
                }
            }
        });

        function updateGrav(x, y) {
            let gravX = 0, gravY = 0;

            switch (orientationAngle) {
                case 0:
                    gravX = x;
                    gravY = -y;
                    break;
                case 90:
                    gravX = -y;
                    gravY = -x;
                    break;
                case 180:
                    gravX = -x;
                    gravY = y;
                    break;
                case 270:
                    gravX = y;
                    gravY = x;
                    break;
            }

            gravX /= 9.8;
            gravY /= 9.8;

            if (isAndroid || isWindows) {
                gravX = -gravX;
                gravY = -gravY;
            }

            if (isiPad) {
                if (orientationAngle == 90 || orientationAngle == 270) {
                    gravX = -gravX;
                    gravY = -gravY;
                }
            }

            if (params.invertAccelerometer) {
                gravX = -gravX;
                gravY = -gravY;
            }

            if (sim !== undefined) {
                Module._pvfs_set_sim_gravity(sim, gravX, gravY);
            }
        }
    </script>
    <script>
        var Module = {};
        let sim;

        const pointerTracker = {};
        const keyTracker = {};
        let touchCount = 0;

        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;



        const locationHash = window.location.hash;
        let rotationGamma = 0;


        class FPSCounter {
            constructor() {
                this.lastTime = performance.now();
                this.frames = 0;
                this.fps = 0;

                this.display = document.getElementById('fpsDisplay');
            }

            update() {
                const now = performance.now();
                this.frames++;

                if (now - this.lastTime >= 1000) {
                    this.fps = this.frames;
                    this.frames = 0;
                    this.lastTime = now;

                    this.display.textContent = `${this.fps}`;

                    if (this.fps < 27) {
                        fpsLowCount++;
                    } else {
                        fpsLowCount = 0;
                    }

                    if (fpsLowCount > 5) {
                        if (params.stepsPerFrame > 1) {
                            params.stepsPerFrame--;
                            stepController.updateDisplay();

                            fpsLowCount = 0;
                        }
                    }
                }
            }

            getFPS() {
                return this.fps;
            }
        }

        const fpsCounter = new FPSCounter();
        let dpr = window.devicePixelRatio || 1;
        let windowScreenXPrev = window.screenX;
        let windowScreenYPrev = window.screenY;
        let windowWidthPrev = window.innerWidth;
        let windowHeightPrev = window.innerHeight;
        let firstWindowShift = true;


        function sizeCanvas() {
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';

            const rect = canvas.getBoundingClientRect();
            dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            if (ctx2d) {
                ctx2d.scale(dpr, dpr);
            }
        }

        sizeCanvas();

        window.addEventListener('resize', () => {
            sizeCanvas();
            if (metaballsSystem) {
                metaballsSystem.resize(canvas.width, canvas.height);
                metaballsSystem.forceBackgroundUpdate(params.liquidGlassMode);
            }
        });

        // Add window resize handler for the carbon ad
        window.addEventListener('resize', function () {
            if (carbonWrapper) {
                const rect = carbonWrapper.getBoundingClientRect();
                const maxX = window.innerWidth - rect.width;
                const maxY = window.innerHeight - rect.height;

                // Check if the ad is outside the window boundaries
                if (rect.right > window.innerWidth || rect.bottom > window.innerHeight) {
                    // Reposition the ad to keep it within bounds
                    const newX = Math.min(rect.left, maxX);
                    const newY = Math.min(rect.top, maxY);

                    carbonWrapper.style.left = Math.max(0, newX) + 'px';
                    carbonWrapper.style.top = Math.max(0, newY) + 'px';
                    carbonWrapper.style.bottom = 'auto';
                    carbonWrapper.style.right = 'auto';
                }
            }
        });

        // let logged = false;

        function draw() {
            if (sim === undefined) {
                return;
            }

            const windowScreenX = window.screenX;
            const windowScreenY = window.screenY;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            if (windowScreenX !== windowScreenXPrev || windowScreenY !== windowScreenYPrev || windowWidth !== windowWidthPrev || windowHeight !== windowHeightPrev) {
                let shiftX = windowScreenX - windowScreenXPrev;
                let shiftY = windowScreenY - windowScreenYPrev;

                if (firstWindowShift) {
                    // Prevent initial window shift from affecting the simulation
                    firstWindowShift = false;
                    shiftX = 0;
                    shiftY = 0;
                }

                Module._pvfs_set_sim_size(sim, window.innerWidth, window.innerHeight, -shiftX, -shiftY, false);
                windowScreenXPrev = windowScreenX;
                windowScreenYPrev = windowScreenY;
                windowWidthPrev = windowWidth;
                windowHeightPrev = windowHeight;
            }

            const numParticles = Module._pvfs_get_particle_count(sim);
            const sim_position_ptr = Module._pvfs_get_particle_positions(sim);
            const sim_material_ptr = Module._pvfs_get_particle_material_ids(sim);

            if (gl) {
                const rect = canvas.getBoundingClientRect();

                if (params.liquidGlassMode !== 'off' && metaballsSystem) {
                    // Use metaballs refraction rendering
                    const kernelRadius = Module._pvfs_get_kernel_radius(sim);
                    const pointSize = Math.max(2, kernelRadius * dpr * 0.8); // Larger points for metaballs

                    const colors = [params.color0, params.color1, params.color2, params.color3];

                    // Begin metaballs rendering (setup once)
                    metaballsSystem.beginMetaballsRender(pointSize);

                    // Render metaballs to RGBA channels in batches
                    for (let start = 0; start < numParticles; start += batchSize) {
                        const end = Math.min(start + batchSize, numParticles);
                        const len = end - start;

                        const posArray = new Float32Array(Module.HEAPF32.buffer, sim_position_ptr + start * 8, len * 2);
                        const matArray = new Uint8Array(Module.HEAP32.buffer, sim_material_ptr + start, len);

                        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                        gl.bufferSubData(gl.ARRAY_BUFFER, 0, posArray);

                        gl.bindBuffer(gl.ARRAY_BUFFER, materialBuffer);
                        gl.bufferSubData(gl.ARRAY_BUFFER, 0, matArray);

                        metaballsSystem.renderMetaballsBatch(positionBuffer, materialBuffer, len);
                    }

                    // End metaballs rendering (cleanup once)
                    metaballsSystem.endMetaballsRender();

                    // Apply Gaussian blur
                    metaballsSystem.applyBlur();

                    // Render with refraction
                    metaballsSystem.renderRefraction(colors, params.metaballsThreshold, params.refractionStrength, params.chromaticAberration, params.lightIntensity, params.absorption, params.materialMode, params.liquidGlassMode);
                } else {
                    // Original rendering
                    gl.viewport(0, 0, canvas.width, canvas.height);
                    gl.clearColor(params.background[0], params.background[1], params.background[2], 1);
                    gl.clear(gl.COLOR_BUFFER_BIT);

                    // Enable blending for antialiasing
                    gl.enable(gl.BLEND);
                    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            let offsetX, offsetY;
            let lastX = 0, lastY = 0;

            dragHandle.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                e.stopPropagation();
                isDragging = true;

                adRect = carbonWrapper.getBoundingClientRect();
                offsetX = e.clientX - adRect.left;
                offsetY = e.clientY - adRect.top;

                lastX = e.clientX;
                lastY = e.clientY;

                // Add dragging class for visual feedback
                carbonWrapper.classList.add('dragging');

                // Add pointerup and pointermove to document to allow dragging outside the element
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
            });

            function onPointerMove(e) {
                if (!isDragging) return;

                const newX = e.clientX - offsetX;
                const newY = e.clientY - offsetY;

                // Keep the ad within viewport bounds
                const maxX = window.innerWidth - adRect.width;
                const maxY = window.innerHeight - adRect.height;

                const boundedX = Math.min(Math.max(0, newX), maxX);
                const boundedY = Math.min(Math.max(0, newY), maxY);

                carbonWrapper.style.left = boundedX + 'px';
                carbonWrapper.style.bottom = 'auto'; // Override the default bottom position
                carbonWrapper.style.right = 'auto'; // Override the default right position
                carbonWrapper.style.top = boundedY + 'px';

                // Additional circle collision at pointer for more interaction

                }

                lastX = e.clientX;
                lastY = e.clientY;
            }

            function onPointerUp() {
                isDragging = false;
                carbonWrapper.classList.remove('dragging');
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
