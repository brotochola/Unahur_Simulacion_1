<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>07 · MLS-MPM · Material Point Method</title>
    <style>
        :root {
            --bg: #060a10;
            --bg2: #0a0f17;
            --panel: rgba(14, 22, 32, .72);
            --border: rgba(120, 170, 200, .16);
            --text: #d7ecf6;
            --muted: #6d8a9c;
            --faint: #46606f;
            --accent: #57d9ff;
            --tank: #0b141d
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: radial-gradient(120% 140% at 50% 0%, var(--bg2), var(--bg));
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, sans-serif
        }

        .stage {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 20px 14px 40px
        }

        .masthead {
            width: min(96vw, 900px);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px
        }

        .masthead .mark {
            font-weight: 600;
            font-size: 15px
        }

        .masthead .mark b {
            color: var(--accent)
        }

        .masthead .hint {
            font-size: 12.5px;
            color: var(--muted);
            text-align: right
        }

        .workspace {
            width: min(96vw, 900px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            align-items: flex-start
        }

        .tank-col {
            flex: 1 1 480px;
            min-width: 300px;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .tank-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 14px;
            background: var(--tank);
            box-shadow: 0 0 0 1px rgba(120, 170, 200, .14), 0 30px 60px -20px #000a;
            overflow: hidden;
            touch-action: none
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            image-rendering: pixelated
        }

        .readout {
            position: absolute;
            left: 12px;
            bottom: 10px;
            font-size: 11.5px;
            color: rgba(215, 236, 246, .55);
            font-variant-numeric: tabular-nums;
            pointer-events: none;
            text-shadow: 0 1px 3px #000
        }

        .dock {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 18px;
            padding: 10px 16px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(10px)
        }

        .dock .buttons {
            display: flex;
            gap: 8px
        }

        button {
            font: 500 13px inherit;
            color: var(--text);
            background: rgba(87, 217, 255, .08);
            border: 1px solid rgba(87, 217, 255, .22);
            border-radius: 8px;
            padding: 7px 13px;
            cursor: pointer
        }

        button:hover {
            background: rgba(87, 217, 255, .16)
        }

        button.primary {
            background: rgba(87, 217, 255, .18)
        }

        button[aria-pressed="true"] {
            background: rgba(87, 217, 255, .24);
            border-color: var(--accent)
        }

        button.small {
            font-size: 11.5px;
            padding: 5px 10px
        }

        .sliders {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-left: auto
        }

        .slider {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 118px;
            flex: 1 1 118px
        }

        .slider label {
            font-size: 11px;
            color: var(--muted);
            display: flex;
            justify-content: space-between
        }

        .slider label span {
            color: var(--text);
            font-variant-numeric: tabular-nums
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: rgba(120, 170, 200, .25)
        }

        input[type=range]:disabled {
            opacity: .35
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer
        }

        .panel-col {
            flex: 1 1 300px;
            min-width: 280px;
            max-width: 340px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 6px 16px 14px;
            max-height: 78vh;
            overflow-y: auto
        }

        .section {
            padding: 12px 0;
            border-bottom: 1px solid rgba(120, 170, 200, .1)
        }

        .section:last-child {
            border-bottom: 0
        }

        .section h3 {
            font-size: 12.5px;
            margin: 0 0 10px
        }

        .row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 12px
        }

        .row:last-child {
            margin-bottom: 0
        }

        .row label {
            font-size: 11.5px;
            color: var(--muted);

            justify-content: space-between
        }

        .row label span {

            font-variant-numeric: tabular-nums
        }

        .row.inline {
            flex-direction: row;
            align-items: center;
            justify-content: space-between
        }

        .stat-grid {
            display: grid;
            grid-template-columns: auto auto;
            gap: 5px 10px;
            font-size: 11.5px
        }

        .stat-grid .k {
            color: var(--muted)
        }

        .stat-grid .v {
            color: var(--text);
            text-align: right;
            font-variant-numeric: tabular-nums
        }

        @media(max-width:520px) {
            .sliders {
                margin-left: 0;
                width: 100%
            }
        }

<body>
    <div class="stage">
        <div class="masthead">
            <div class="mark">MLS-MPM <b>·</b> fluido 2D <span
                    style="color:var(--muted);font-weight:400;font-size:12px">Worker</span></div>
            <div class="hint">Arrastrá en el tanque · física en Web Worker</div>
        </div>
        <div class="workspace">
            <div class="tank-col">
                <div class="tank-wrap" id="tankWrap">
                    <canvas id="sim"></canvas>
                    <div class="readout" id="readout">iniciando…</div>
                </div>
                <div class="dock">
                    <div class="buttons">
                        <button class="primary" id="resetBtn">Reiniciar</button>
                        <button id="splashBtn">Splash</button>
                        <button id="pauseBtn" aria-pressed="false">Pausa</button>
                    </div>
                    <div class="sliders">
                        <div class="slider"><label>Gravedad <span id="gravityVal">9.8</span></label><input id="gravity"
                                type="range" min="0" max="30" step="0.1" value="9.8"></div>
                        <div class="slider"><label>Rigidez k <span id="stiffnessVal">400</span></label><input
                                id="stiffness" type="range" min="20" max="2000" step="10" value="400"></div>
                    </div>
                </div>
            </div>
            <div class="panel-col">
                <div class="section">
                    <h3>Física</h3>
                    <div class="row"><label>dt físico <span id="dtVal">1.00e-4 s</span></label><input id="dt"
                            type="range" min="0" max="8" step="1" value="4"></div>
                    <div class="row inline"><label style="flex:1">Substeps / frame <span
                                id="substepsVal">8</span></label><button class="small" id="autoBtn"
                            aria-pressed="true">Auto</button></div>
                    <input id="substeps" type="range" min="1" max="16" step="1" value="8" disabled>
                    <div class="row" style="margin-top:12px"><label>Gamma (Tait) <span
                                id="gammaVal">1.0</span></label><input id="gamma" type="range" min="0.5" max="7"
                            step="0.1" value="1"></div>
                    <div class="row"><label>Densidad ρ₀ <span id="rho0Val">1.00</span></label><input id="rho0"
                            type="range" min="0.3" max="3" step="0.05" value="1"></div>
                </div>
                <div class="section">
                    <h3>Dominio</h3>
                    <div class="row"><label>Grilla <span id="gridVal">128×128</span></label><input id="gridRes"
                            type="range" min="0" max="5" step="1" value="3"></div>
                    <div class="row"><label>Partículas <span id="particlesVal">9000</span></label><input id="particles"
                            type="range" min="1000" max="20000" step="500" value="9000"></div>
                </div>
                <div class="section">
                    <h3>Mouse</h3>
                    <div class="row"><label>Radio <span id="radiusVal">0.090</span></label><input id="radius"
                            type="range" min="0.02" max="0.25" step="0.005" value="0.09"></div>
                    <div class="row"><label>Fuerza <span id="strengthVal">1.6</span></label><input id="strength"
                            type="range" min="0.2" max="4" step="0.1" value="1.6"></div>
                </div>
                <div class="section">
                    <h3>Render</h3>
                    <div class="row"><label>Tamaño <span id="sizeVal">1.00×</span></label><input id="size" type="range"
                            min="0.4" max="2.5" step="0.05" value="1"></div>
                    <div class="row"><label>Estela <span id="trailVal">35%</span></label><input id="trail" type="range"
                            min="0" max="1" step="0.01" value="0.35"></div>
                </div>
                <div class="section">
                    <h3>Diagnóstico</h3>
                    <div class="stat-grid">
                        <div class="k">dt</div>
                        <div class="v" id="telDt">—</div>
                        <div class="k">substeps</div>
                        <div class="v" id="telSubsteps">—</div>
                        <div class="k">sim/frame</div>
                        <div class="v" id="telSimMs">—</div>
                        <div class="k">render</div>
                        <div class="v" id="telRenderMs">—</div>
                        <div class="k">fps</div>
                        <div class="v" id="telFps">—</div>
                        <div class="k">partículas</div>
                        <div class="v" id="telParticles">—</div>
                        <div class="k">grilla</div>
                        <div class="v" id="telGrid">—</div>
                        <div class="k">worker</div>
                        <div class="v" id="telWorker">…</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script id="worker-src" type="javascript/worker">
"use strict";
const BOUND = 3;
const MAX_SPEED = 80;
const MAX_SPEED2 = MAX_SPEED * MAX_SPEED;
const MAX_P = 20000;

let N = 128, DX = 1 / 128, INV = 128;
let RHO0 = 1, PVOL = 0, PMASS = 0;
let DT = 1e-4, GRAV = 9.8, STIFF = 400, GAMMA = 1;
let IRAD = 0.09, ISTR = 1.6, TARGET = 9000, COUNT = 0;

const px = new Float32Array(MAX_P);
const py = new Float32Array(MAX_P);
const vx = new Float32Array(MAX_P);
const vy = new Float32Array(MAX_P);
const C00 = new Float32Array(MAX_P);
const C01 = new Float32Array(MAX_P);
const C10 = new Float32Array(MAX_P);
const C11 = new Float32Array(MAX_P);
const Jp = new Float32Array(MAX_P);

let gvx, gvy, gm;

function allocGrid() {
  const n = N * N;
  gvx = new Float32Array(n);
  gvy = new Float32Array(n);
  gm = new Float32Array(n);
}
function recomputeMass() {
  PVOL = (DX * 0.5) * (DX * 0.5);
  PMASS = PVOL * RHO0;
}
allocGrid();
recomputeMass();

function applyParams(p) {
  if (!p) return;
  if (p.dt != null) DT = p.dt;
  if (p.gravity != null) GRAV = p.gravity;
  if (p.stiffness != null) STIFF = p.stiffness;
  if (p.gamma != null) GAMMA = p.gamma;
  if (p.rho0 != null) { RHO0 = p.rho0; recomputeMass(); }
  if (p.interactRadius != null) IRAD = p.interactRadius;
  if (p.interactStrength != null) ISTR = p.interactStrength;
  if (p.targetParticles != null) TARGET = p.targetParticles | 0;
  if (p.nGrid != null && (p.nGrid | 0) !== N) {
    N = p.nGrid | 0;
    DX = 1 / N;
    INV = N;
    allocGrid();
    recomputeMass();
  }
}

function seed(start, count, x0, y0, x1, y1, vx0, vy0) {
  const aspect = Math.max(0.05, (x1 - x0) / (y1 - y0));
  const cols = Math.max(1, Math.round(Math.sqrt(count * aspect)));
  const rows = Math.max(1, Math.ceil(count / cols));
  let p = start;
  const end = Math.min(MAX_P, start + count);
  outer: for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      if (p >= end) break outer;
      px[p] = x0 + ((i + 0.5) / cols) * (x1 - x0) + (Math.random() - 0.5) * 0.5 * ((x1 - x0) / cols);
      py[p] = y0 + ((j + 0.5) / rows) * (y1 - y0) + (Math.random() - 0.5) * 0.5 * ((y1 - y0) / rows);
      vx[p] = vx0; vy[p] = vy0;
      C00[p] = C01[p] = C10[p] = C11[p] = 0;
      Jp[p] = 1;
      p++;
    }
  }
  return p - start;
}

function resetSim() {
  COUNT = Math.min(TARGET, MAX_P);
  seed(0, COUNT, 0.08, 0.10, 0.52, 0.72, 0, 0);
}

function splash() {
  if (COUNT >= MAX_P) return;
  const add = Math.min(1000, MAX_P - COUNT);
  const cx = 0.25 + Math.random() * 0.5;
  seed(COUNT, add, cx - 0.1, 0.80, cx + 0.1, 0.94, (Math.random() - 0.5) * 2, -2);
  COUNT += add;
}

function substep(mouse) {
  const n = N, dx = DX, inv = INV, dt = DT, mass = PMASS, vol = PVOL;
  const stiff = STIFF, gamma = GAMMA, grav = GRAV;
  const inv2 = inv * inv;
  const fourInv2 = 4 * inv2;
  const last = n - BOUND;

  gvx.fill(0); gvy.fill(0); gm.fill(0);

  for (let p = 0; p < COUNT; p++) {
    const xp = px[p] * inv, yp = py[p] * inv;
    let bi = Math.floor(xp - 0.5) | 0;
    let bj = Math.floor(yp - 0.5) | 0;
    if (bi < 0) bi = 0; else if (bi > n - 3) bi = n - 3;
    if (bj < 0) bj = 0; else if (bj > n - 3) bj = n - 3;
    const fx = xp - bi, fy = yp - bj;
    const omx = 1.5 - fx, omy = 1.5 - fy;
    const w0x = 0.5 * omx * omx, w1x = 0.75 - (fx - 1) * (fx - 1), w2x = 0.5 * (fx - 0.5) * (fx - 0.5);
    const w0y = 0.5 * omy * omy, w1y = 0.75 - (fy - 1) * (fy - 1), w2y = 0.5 * (fy - 0.5) * (fy - 0.5);

    let J = Jp[p]; if (J < 0.05) J = 0.05;
    let pressure = gamma === 1 ? stiff * (1 / J - 1) : stiff * (Math.pow(J, -gamma) - 1);
    if (pressure < 0) pressure = 0;

    const stress = dt * 4 * vol * pressure * inv2;
    const a00 = stress + mass * C00[p], a01 = mass * C01[p];
    const a10 = mass * C10[p], a11 = stress + mass * C11[p];
    const vxp = vx[p], vyp = vy[p];
    const d0x = (0 - fx) * dx, d1x = (1 - fx) * dx, d2x = (2 - fx) * dx;
    const d0y = (0 - fy) * dx, d1y = (1 - fy) * dx, d2y = (2 - fy) * dx;
    const r0 = bi * n + bj, r1 = (bi + 1) * n + bj, r2 = (bi + 2) * n + bj;

    let w, idx, dpx, dpy;
    w = w0x * w0y; dpx = d0x; dpy = d0y; idx = r0;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w0x * w1y; dpy = d1y; idx = r0 + 1;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w0x * w2y; dpy = d2y; idx = r0 + 2;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w1x * w0y; dpx = d1x; dpy = d0y; idx = r1;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w1x * w1y; dpy = d1y; idx = r1 + 1;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w1x * w2y; dpy = d2y; idx = r1 + 2;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w2x * w0y; dpx = d2x; dpy = d0y; idx = r2;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w2x * w1y; dpy = d1y; idx = r2 + 1;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
    w = w2x * w2y; dpy = d2y; idx = r2 + 2;
    gvx[idx] += w * (mass * vxp + a00 * dpx + a01 * dpy);
    gvy[idx] += w * (mass * vyp + a10 * dpx + a11 * dpy);
    gm[idx] += w * mass;
  }

  const mgx = mouse.x * inv, mgy = mouse.y * inv;
  const rG = IRAD * inv, rG2 = rG * rG;
  const doI = mouse.down && (mouse.vx !== 0 || mouse.vy !== 0);
  const mvx = mouse.vx * ISTR, mvy = mouse.vy * ISTR;

  for (let i = 0; i < n; i++) {
    const di = i - mgx;
    const row = i * n;
    for (let j = 0; j < n; j++) {
      const idx = row + j;
      const m = gm[idx];
      if (m <= 0) { gvx[idx] = 0; gvy[idx] = 0; continue; }
      let gv = gvx[idx] / m;
      let gw = gvy[idx] / m - dt * grav;
      if (doI) {
        const dj = j - mgy;
        const d2 = di * di + dj * dj;
        if (d2 < rG2 && d2 > 1e-12) {
          const f = 1 - Math.sqrt(d2) / rG;
          gv += mvx * f; gw += mvy * f;
        }
      }
      const s2 = gv * gv + gw * gw;
      if (s2 > MAX_SPEED2) {
        const s = MAX_SPEED / Math.sqrt(s2);
        gv *= s; gw *= s;
      }
      if (i < BOUND && gv < 0) gv = 0;
      else if (i > last && gv > 0) gv = 0;
      if (j < BOUND && gw < 0) gw = 0;
      else if (j > last && gw > 0) gw = 0;
      gvx[idx] = gv; gvy[idx] = gw;
    }
  }

  for (let p = 0; p < COUNT; p++) {
    const xp = px[p] * inv, yp = py[p] * inv;
    let bi = Math.floor(xp - 0.5) | 0;
    let bj = Math.floor(yp - 0.5) | 0;
    if (bi < 0) bi = 0; else if (bi > n - 3) bi = n - 3;
    if (bj < 0) bj = 0; else if (bj > n - 3) bj = n - 3;
    const fx = xp - bi, fy = yp - bj;
    const omx = 1.5 - fx, omy = 1.5 - fy;
    const w0x = 0.5 * omx * omx, w1x = 0.75 - (fx - 1) * (fx - 1), w2x = 0.5 * (fx - 0.5) * (fx - 0.5);
    const w0y = 0.5 * omy * omy, w1y = 0.75 - (fy - 1) * (fy - 1), w2y = 0.5 * (fy - 0.5) * (fy - 0.5);
    const d0x = (0 - fx) * dx, d1x = (1 - fx) * dx, d2x = (2 - fx) * dx;
    const d0y = (0 - fy) * dx, d1y = (1 - fy) * dx, d2y = (2 - fy) * dx;
    const r0 = bi * n + bj, r1 = (bi + 1) * n + bj, r2 = (bi + 2) * n + bj;

    let nvx = 0, nvy = 0, n00 = 0, n01 = 0, n10 = 0, n11 = 0;
    let w, gx, gy, k;
    w = w0x * w0y; gx = gvx[r0]; gy = gvy[r0]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d0x; n01 += k * gx * d0y; n10 += k * gy * d0x; n11 += k * gy * d0y;
    w = w0x * w1y; gx = gvx[r0 + 1]; gy = gvy[r0 + 1]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d0x; n01 += k * gx * d1y; n10 += k * gy * d0x; n11 += k * gy * d1y;
    w = w0x * w2y; gx = gvx[r0 + 2]; gy = gvy[r0 + 2]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d0x; n01 += k * gx * d2y; n10 += k * gy * d0x; n11 += k * gy * d2y;
    w = w1x * w0y; gx = gvx[r1]; gy = gvy[r1]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d1x; n01 += k * gx * d0y; n10 += k * gy * d1x; n11 += k * gy * d0y;
    w = w1x * w1y; gx = gvx[r1 + 1]; gy = gvy[r1 + 1]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d1x; n01 += k * gx * d1y; n10 += k * gy * d1x; n11 += k * gy * d1y;
    w = w1x * w2y; gx = gvx[r1 + 2]; gy = gvy[r1 + 2]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d1x; n01 += k * gx * d2y; n10 += k * gy * d1x; n11 += k * gy * d2y;
    w = w2x * w0y; gx = gvx[r2]; gy = gvy[r2]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d2x; n01 += k * gx * d0y; n10 += k * gy * d2x; n11 += k * gy * d0y;
    w = w2x * w1y; gx = gvx[r2 + 1]; gy = gvy[r2 + 1]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d2x; n01 += k * gx * d1y; n10 += k * gy * d2x; n11 += k * gy * d1y;
    w = w2x * w2y; gx = gvx[r2 + 2]; gy = gvy[r2 + 2]; k = fourInv2 * w;
    nvx += w * gx; nvy += w * gy;
    n00 += k * gx * d2x; n01 += k * gx * d2y; n10 += k * gy * d2x; n11 += k * gy * d2y;

    const s2 = nvx * nvx + nvy * nvy;
    if (s2 > MAX_SPEED2) {
      const s = MAX_SPEED / Math.sqrt(s2);
      nvx *= s; nvy *= s;
    }
    vx[p] = nvx; vy[p] = nvy;
    let nx = px[p] + dt * nvx, ny = py[p] + dt * nvy;
    if (nx < 0.002) nx = 0.002; else if (nx > 0.998) nx = 0.998;
    if (ny < 0.002) ny = 0.002; else if (ny > 0.998) ny = 0.998;
    px[p] = nx; py[p] = ny;
    let J = Jp[p] * (1 + dt * (n00 + n11));
    if (J < 0.3) J = 0.3; else if (J > 3) J = 3;
    Jp[p] = J;
    C00[p] = n00; C01[p] = n01; C10[p] = n10; C11[p] = n11;
  }
}

function pack() {
  const out = new Float32Array(COUNT * 3);
  for (let p = 0, o = 0; p < COUNT; p++, o += 3) {
    out[o] = px[p];
    out[o + 1] = py[p];
    const a = vx[p], b = vy[p];
    out[o + 2] = Math.sqrt(a * a + b * b);
  }
  return out;
}

self.onmessage = function (e) {
  const m = e.data;
  if (m.type === "init") {
    applyParams(m.params);
    resetSim();
    self.postMessage({ type: "ready", count: COUNT });
  } else if (m.type === "params") {
    applyParams(m.params);
  } else if (m.type === "reset") {
    applyParams(m.params);
    resetSim();
  } else if (m.type === "splash") {
    splash();
  } else if (m.type === "tick") {
    const t0 = performance.now();
    const steps = m.substeps | 0;
    for (let s = 0; s < steps; s++) substep(m.mouse);
    const packed = pack();
    self.postMessage({ type: "frame", count: COUNT, simMs: performance.now() - t0, data: packed.buffer }, [packed.buffer]);
  }
};
</script>
