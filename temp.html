<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass-Conserving Eulerian Fluid Simulation (Real Gravity)</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        h2 { margin-bottom: 4px; color: #4fc3f7; }
        p { color: #888; margin-top: 0; font-size: 0.85em; }
        canvas {
            border: 2px solid #333;
            background-color: #050505;
            cursor: crosshair;
            image-rendering: pixelated;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #1e1e1e;
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        button {
            background: #0288d1;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #01579b; }
        .stats {
            margin-top: 8px;
            font-size: 0.9em;
            color: #00e676;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h2>Simulador Euleriano de Masa Conservada</h2>
    <p>Advección conservativa ($\sum_i A_{ij} = 1$) con Gravedad Corregida — Arrastrá para dibujar</p>

    <canvas id="simCanvas" width="512" height="512"></canvas>

    <div class="controls">
        <button id="btnReset">Reiniciar</button>
        <label>Gravedad: <input type="range" id="rngGravity" min="0" max="30" value="12" step="1"></label>
    </div>

    <div class="stats" id="stats">Masa Total: 0.000000</div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");

        const NX = 64;
        const NY = 64;
        const CELL_SIZE = canvas.width / NX;
        const DT = 0.1;
        const ITER_PRESSURE = 40;

        let rho = new Float32Array(NX * NY);
        let rho_next = new Float32Array(NX * NY);

        let u = new Float32Array((NX + 1) * NY);
        let v = new Float32Array(NX * (NY + 1));
        let u_next = new Float32Array((NX + 1) * NY);
        let v_next = new Float32Array(NX * (NY + 1));

        let p = new Float32Array(NX * NY);
        let div = new Float32Array(NX * NY);

        const IX = (x, y) => x + y * NX;
        const IX_U = (x, y) => x + y * (NX + 1);
        const IX_V = (x, y) => x + y * NX;

        function init() {
            rho.fill(0);
            u.fill(0);
            v.fill(0);
            p.fill(0);

            // Bloque inicial de líquido en la parte superior
            for (let y = 5; y < 25; y++) {
                for (let x = 20; x < 44; x++) {
                    rho[IX(x, y)] = 1.0;
                }
            }
        }

        function getVelocity(px, py) {
            let x_u = Math.max(0, Math.min(NX, px));
            let y_u = Math.max(0.5, Math.min(NY - 0.5, py)) - 0.5;
            let xi_u = Math.min(Math.floor(x_u), NX - 1), yi_u = Math.min(Math.floor(y_u), NY - 2);
            let tx_u = x_u - xi_u, ty_u = y_u - yi_u;

            let u_val = (1 - tx_u) * (1 - ty_u) * u[IX_U(xi_u, yi_u)] +
                        tx_u * (1 - ty_u) * u[IX_U(xi_u + 1, yi_u)] +
                        (1 - tx_u) * ty_u * u[IX_U(xi_u, yi_u + 1)] +
                        tx_u * ty_u * u[IX_U(xi_u + 1, yi_u + 1)];

            let x_v = Math.max(0.5, Math.min(NX - 0.5, px)) - 0.5;
            let y_v = Math.max(0, Math.min(NY, py));
            let xi_v = Math.min(Math.floor(x_v), NX - 2), yi_v = Math.min(Math.floor(y_v), NY - 1);
            let tx_v = x_v - xi_v, ty_v = y_v - yi_v;

            let v_val = (1 - tx_v) * (1 - ty_v) * v[IX_V(xi_v, yi_v)] +
                        tx_v * (1 - ty_v) * v[IX_V(xi_v + 1, yi_v)] +
                        (1 - tx_v) * ty_v * v[IX_V(xi_v, yi_v + 1)] +
                        tx_v * ty_v * v[IX_V(xi_v + 1, yi_v + 1)];

            return { u: u_val, v: v_val };
        }

        // Advección Conservativa Exacta de Densidad
        function advectDensityMassConserving() {
            rho_next.fill(0);
            let colSums = new Float32Array(NX * NY);
            let entries = [];

            for (let y = 0; y < NY; y++) {
                for (let x = 0; x < NX; x++) {
                    let i = IX(x, y);
                    let cx = x + 0.5;
                    let cy = y + 0.5;

                    let vel = getVelocity(cx, cy);
                    let srcX = Math.max(0.5, Math.min(NX - 0.5, cx - vel.u * DT));
                    let srcY = Math.max(0.5, Math.min(NY - 0.5, cy - vel.v * DT));

                    let x0 = Math.floor(srcX - 0.5);
                    let y0 = Math.floor(srcY - 0.5);
                    let tx = (srcX - 0.5) - x0;
                    let ty = (srcY - 0.5) - y0;

                    let neighbors = [
                        { j: IX(x0, y0), w: (1 - tx) * (1 - ty) },
                        { j: IX(x0 + 1, y0), w: tx * (1 - ty) },
                        { j: IX(x0, y0 + 1), w: (1 - tx) * ty },
                        { j: IX(x0 + 1, y0 + 1), w: tx * ty }
                    ];

                    for (let n of neighbors) {
                        if (n.w > 0 && n.j >= 0 && n.j < NX * NY) {
                            entries.push({ i: i, j: n.j, w: n.w });
                            colSums[n.j] += n.w;
                        }
                    }
                }
            }

            for (let k = 0; k < entries.length; k++) {
                let e = entries[k];
                let beta_j = colSums[e.j];
                if (beta_j > 0) {
                    let A_ij = e.w / beta_j;
                    rho_next[e.i] += A_ij * rho[e.j];
                }
            }

            rho.set(rho_next);
        }

        function advectVelocity() {
            for (let y = 0; y < NY; y++) {
                for (let x = 1; x < NX; x++) {
                    let vel = getVelocity(x, y + 0.5);
                    u_next[IX_U(x, y)] = getVelocity(x - vel.u * DT, (y + 0.5) - vel.v * DT).u;
                }
            }
            for (let y = 1; y < NY; y++) {
                for (let x = 0; x < NX; x++) {
                    let vel = getVelocity(x + 0.5, y);
                    v_next[IX_V(x, y)] = getVelocity((x + 0.5) - vel.u * DT, y - vel.v * DT).v;
                }
            }
            u.set(u_next);
            v.set(v_next);
        }

        function solvePressure() {
            let gravity = parseFloat(document.getElementById("rngGravity").value);

            // APLICACIÓN CORREGIDA DE GRAVEDAD: Ponderada directamente por la masa
            if (gravity > 0) {
                for (let y = 0; y < NY - 1; y++) {
                    for (let x = 0; x < NX; x++) {
                        let avgDensity = 0.5 * (rho[IX(x, y)] + rho[IX(x, y + 1)]);
                        if (avgDensity > 0.001) {
                            // Fuerza proporcional a la masa del fluido
                            v[IX_V(x, y + 1)] += gravity * avgDensity * DT;
                        }
                    }
                }
            }

            for (let y = 0; y < NY; y++) {
                for (let x = 0; x < NX; x++) {
                    let du = u[IX_U(x + 1, y)] - u[IX_U(x, y)];
                    let dv = v[IX_V(x, y + 1)] - v[IX_V(x, y)];
                    div[IX(x, y)] = -(du + dv);
                    p[IX(x, y)] = 0;
                }
            }

            for (let iter = 0; iter < ITER_PRESSURE; iter++) {
                for (let y = 0; y < NY; y++) {
                    for (let x = 0; x < NX; x++) {
                        let p_left = (x > 0) ? p[IX(x - 1, y)] : 0;
                        let p_right = (x < NX - 1) ? p[IX(x + 1, y)] : 0;
                        let p_top = (y > 0) ? p[IX(x, y - 1)] : 0;
                        let p_bottom = (y < NY - 1) ? p[IX(x, y + 1)] : 0;

                        let neighbors = 4;
                        if (x === 0) neighbors--;
                        if (x === NX - 1) neighbors--;
                        if (y === 0) neighbors--;
                        if (y === NY - 1) neighbors--;

                        p[IX(x, y)] = (div[IX(x, y)] + p_left + p_right + p_top + p_bottom) / neighbors;
                    }
                }
            }

            for (let y = 0; y < NY; y++) {
                for (let x = 1; x < NX; x++) {
                    u[IX_U(x, y)] -= (p[IX(x, y)] - p[IX(x - 1, y)]);
                }
            }
            for (let y = 1; y < NY; y++) {
                for (let x = 0; x < NX; x++) {
                    v[IX_V(x, y)] -= (p[IX(x, y)] - p[IX(x, y - 1)]);
                }
            }

            // Paredes límite
            for (let y = 0; y < NY; y++) { u[IX_U(0, y)] = 0; u[IX_U(NX, y)] = 0; }
            for (let x = 0; x < NX; x++) { v[IX_V(x, 0)] = 0; v[IX_V(x, NY)] = 0; }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let totalMass = 0;

            for (let y = 0; y < NY; y++) {
                for (let x = 0; x < NX; x++) {
                    let d = rho[IX(x, y)];
                    totalMass += d;

                    if (d > 0.0001) {
                        if (d >= 0.5) {
                            ctx.fillStyle = `rgb(0, ${Math.floor(140 + Math.min(1, d) * 115)}, ${Math.floor(200 + Math.min(1, d) * 55)})`;
                        } else {
                            ctx.fillStyle = `rgba(30, 144, 255, ${d * 1.8})`;
                        }
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            document.getElementById("stats").innerText = `Masa Total Simulada: ${totalMass.toFixed(6)}`;
        }

        function step() {
            advectDensityMassConserving();
            advectVelocity();
            solvePressure();
            render();
            requestAnimationFrame(step);
        }

        let isMouseDown = false;
        canvas.addEventListener("mousedown", () => isMouseDown = true);
        canvas.addEventListener("mouseup", () => isMouseDown = false);
        canvas.addEventListener("mousemove", (e) => {
            if (!isMouseDown) return;
            let rect = canvas.getBoundingClientRect();
            let mx = Math.floor((e.clientX - rect.left) / CELL_SIZE);
            let my = Math.floor((e.clientY - rect.top) / CELL_SIZE);

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    let cx = mx + dx, cy = my + dy;
                    if (cx >= 0 && cx < NX && cy >= 0 && cy < NY) {
                        rho[IX(cx, cy)] = 1.0;
                    }
                }
            }
        });

        document.getElementById("btnReset").addEventListener("click", init);

        init();
        step();
    </script>
</body>
</html>
